<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{--red:#ff1e2d;--deep:#a80010;--ink:#060102;--glow:rgba(255,30,45,.26);--txt:#ffe9ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font:700 1.1rem Rajdhani,Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{display:grid;grid-template-rows:56px minmax(0,1fr);height:100dvh}
/* background */
#road{position:fixed;inset:auto 0 0;height:60%;perspective:300px;overflow:hidden;z-index:0}
#road::before{content:"";position:absolute;inset:-50% -50% 0;transform:rotateX(62deg);transform-origin:bottom;background:repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,30,45,.15) 78px 80px),repeating-linear-gradient(0deg,transparent 0 78px,rgba(255,30,45,.15) 78px 80px);animation:road 1.4s linear infinite}
#road::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--ink),transparent 70%)}
@keyframes road{to{background-position:0 80px,0 80px}}
.sp{position:fixed;height:2px;background:linear-gradient(90deg,transparent,var(--red));opacity:.32;animation:zip linear infinite;z-index:0}
@keyframes zip{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
/* header */
header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;border-bottom:2px solid var(--red);box-shadow:0 4px 24px var(--glow);background:rgba(10,0,2,.82)}
.logo{font:900 1rem Orbitron;letter-spacing:.14em;color:var(--red);text-shadow:0 0 10px var(--red);white-space:nowrap}
nav{display:flex;gap:clamp(4px,1vw,12px)}
nav button{font:900 clamp(.62rem,1.2vw,.85rem) Orbitron;letter-spacing:.06em;color:var(--red);background:transparent;border:2px solid var(--red);padding:6px clamp(8px,1.4vw,18px);transform:skewX(-18deg);cursor:inherit;transition:.25s}
nav button span{display:inline-block;transform:skewX(18deg)}
nav button:hover{box-shadow:0 0 18px var(--red)}nav button.on{background:var(--red);color:#000;box-shadow:0 0 24px var(--red)}
.rpm{display:flex;gap:3px;align-items:flex-end;height:24px}
.rpm i{width:6px;background:var(--red);box-shadow:0 0 8px var(--red);animation:rv 1s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes rv{from{height:20%}to{height:100%}}
/* stage + views */
.stage{position:relative;z-index:2;min-height:0}
.view{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:10px clamp(12px,3vw,40px);overflow:hidden}
.view.on{display:flex}
.fit{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;flex:none;gap:clamp(8px,1.6vh,16px);transform-origin:center}
h2{font:900 clamp(1.3rem,3.4vw,2.4rem) Orbitron;color:var(--red);text-shadow:0 0 16px var(--red);letter-spacing:.1em}
@keyframes glt{0%,92%,100%{transform:none}94%{transform:translateX(-5px) skewX(8deg)}96%{transform:translateX(5px)}}
/* card with back face that flips to front by itself */
.c{position:relative;border:2px solid var(--red);background:rgba(52,12,24,.7);box-shadow:0 0 18px var(--glow);padding:clamp(10px,1.8vh,18px);transform-style:preserve-3d;animation:flip 1.3s cubic-bezier(.2,.8,.2,1) var(--d,.8s) backwards;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);text-align:left;min-width:0}
.c,.c>*{backface-visibility:hidden}
.c::before{content:"F1";position:absolute;inset:0;display:grid;place-items:center;font:900 2rem Orbitron;color:var(--red);background:repeating-linear-gradient(45deg,#14000a 0 6px,#0a0004 6px 12px);transform:rotateY(180deg);backface-visibility:hidden;text-shadow:0 0 18px var(--red)}
@keyframes flip{from{transform:perspective(900px) rotateY(180deg) translateY(30px)}to{transform:perspective(900px) rotateY(0)}}
.c small{display:block;font:500 .6rem Orbitron;color:var(--red);letter-spacing:.14em;margin-bottom:3px}
.c b{color:#fff;font-size:clamp(1rem,1.7vw,1.35rem);overflow-wrap:anywhere}
.c:hover{box-shadow:0 0 40px var(--red)}
/* home: cockpit */
.stage>.view:first-child{padding:0}
.hm{position:relative;width:100%;height:100%;display:grid;grid-template-columns:1.8fr 1fr;grid-template-rows:minmax(0,1fr) auto}
.ht{padding-left:clamp(10px,3vw,60px);z-index:2;min-width:0}
.hi{font:900 clamp(2.4rem,min(8vw,9.5vh),5.5rem) Orbitron;color:var(--red);line-height:1;text-shadow:0 0 14px rgba(255,30,45,.7);animation:hiin .9s cubic-bezier(.2,1.4,.3,1) backwards}
.hi span{font:500 .3em Orbitron;letter-spacing:.25em;color:#fff;margin-left:.3em}
@keyframes hiin{from{opacity:0;transform:scale(.4) translateX(-60px)}}
.nm{font:900 clamp(2rem,min(7vw,10vh),7.6rem) Orbitron;color:#fff;line-height:1.1;text-transform:uppercase;text-shadow:0 0 12px rgba(255,30,45,.6);margin-top:clamp(6px,1.4vh,14px)}
.nm span{display:block;white-space:nowrap}
.nm i{display:inline-block;font-style:normal;animation:slam .6s cubic-bezier(.2,1.6,.3,1) var(--d) backwards,wave 4.5s ease-in-out var(--p) infinite}
@keyframes wave{0%,50%,100%{color:#fff}25%{color:#ffd2d6;text-shadow:0 0 18px rgba(255,30,45,.85)}}
@keyframes slam{from{opacity:0;transform:translateY(-70px) scale(2.4);filter:blur(8px)}}
.sl{display:flex;gap:10px;margin-top:clamp(10px,2.4vh,22px)}
.sl i{width:clamp(18px,3.2vh,32px);aspect-ratio:1;border-radius:50%;background:#2a0007;border:2px solid var(--deep);animation:sl 4s infinite}
@keyframes sl{0%,8%{background:#2a0007;box-shadow:none}14%,70%{background:var(--red);box-shadow:0 0 22px var(--red)}78%,100%{background:#2a0007;box-shadow:none}}
.idw{position:relative;align-self:stretch;touch-action:none;z-index:3}
.mir{position:absolute;top:0;left:50%;width:min(60%,220px);height:14px;transform:translateX(-50%);background:#14050a;border:2px solid var(--red);border-radius:0 0 14px 14px;z-index:4;box-shadow:0 0 16px var(--glow)}
#lan{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#badge{position:absolute;left:0;top:0;width:clamp(120px,min(41vh,34vw),540px);aspect-ratio:3/4;transform-origin:50% 0;border-radius:14px;background:linear-gradient(160deg,#fff,#ddd 60%,#bbb);cursor:grab;touch-action:none;padding:clamp(7px,1.2vh,12px);display:flex;flex-direction:column;gap:clamp(5px,1vh,9px);box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 30px var(--glow);overflow:hidden}
#badge.drag{cursor:grabbing}
#badge::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.6s infinite;pointer-events:none}
@keyframes sh{40%,100%{transform:translateX(120%)}}
.clip{width:34%;height:7px;margin:0 auto;border-radius:4px;background:#333;flex:none}
.bp{position:relative;flex:1;min-height:0;border:3px solid #111;background:#200006;display:grid;place-items:center;font:900 2.4rem Orbitron;color:var(--red);overflow:hidden}
.bp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.db{position:relative;grid-column:1/-1;height:clamp(96px,20vh,190px);display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(10px,5vw,90px) clamp(6px,1.5vh,16px);animation:dbin 1s .2s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes dbin{from{transform:translateY(100%)}}
.db::before{content:"";position:absolute;left:-3%;right:-3%;bottom:0;top:22%;border-top:2px solid var(--red);border-radius:50% 50% 0 0/22% 22% 0 0;background:linear-gradient(#1b0610,#0a0206);box-shadow:0 -10px 40px rgba(255,30,45,.25)}
.g{position:relative;width:clamp(90px,19vh,180px);aspect-ratio:1;filter:drop-shadow(0 0 14px var(--glow));z-index:1}
.g svg{width:100%;height:100%}
.rd{position:absolute;left:0;right:0;bottom:15%;text-align:center}
.rd b{font:900 clamp(.9rem,2.6vh,1.4rem) Orbitron;color:#fff;text-shadow:0 0 10px var(--red)}
.rd small{display:block;font:500 clamp(.4rem,1.2vh,.6rem) Orbitron;color:var(--red);letter-spacing:.2em}
.nd{transform-origin:110px 110px}
.mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:clamp(6px,2vh,20px)}
.led{display:flex;gap:4px}
.led i{width:clamp(8px,1.5vw,18px);height:clamp(8px,1.6vh,14px);border-radius:3px;background:#2a0b12;transition:.08s}
.led i:nth-child(-n+5).on{background:#2dff6a;box-shadow:0 0 10px #2dff6a}
.led i:nth-child(n+6):nth-child(-n+10).on{background:#ff1e2d;box-shadow:0 0 10px #ff1e2d}
.led i:nth-child(n+11).on{background:#3aa0ff;box-shadow:0 0 10px #3aa0ff}
.gear{font:900 clamp(1.8rem,7vh,3.6rem) Orbitron;color:#fff;text-shadow:0 0 18px var(--red);line-height:1}
.mid small{font:500 clamp(.5rem,1.4vh,.75rem) Orbitron;color:var(--red);letter-spacing:.24em;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#boot.off{opacity:0;visibility:hidden}
#bt{font:900 clamp(1rem,3vw,1.6rem) Orbitron;color:var(--red);letter-spacing:.2em;text-shadow:0 0 14px var(--red);line-height:2}
#bt span{display:block;opacity:0;animation:inn .2s forwards}@keyframes inn{to{opacity:1}}
/* soft headlight that follows the cursor */
#hl{position:fixed;left:0;top:0;z-index:1;pointer-events:none;will-change:transform;opacity:0;transition:opacity .6s}
#hl.on{opacity:1}
.lamp{position:absolute;left:-160px;top:-160px;width:320px;height:320px;border-radius:50%;background:radial-gradient(rgba(255,226,170,.18),rgba(255,226,170,.06) 45%,transparent 68%)}
/* home extras: soft and calm */
.role{font:900 clamp(.8rem,2.2vh,1.2rem) Orbitron;color:var(--red);letter-spacing:.14em;margin-top:clamp(8px,1.8vh,16px);min-height:1.4em}
.role::after{content:"▮";margin-left:4px;animation:bl 1s infinite}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(8px,1.8vh,16px)}
.tags b{font:500 clamp(.6rem,1.5vh,.8rem) Orbitron;border:1px solid var(--red);padding:4px 10px;transform:skewX(-14deg);color:#fff;background:rgba(255,30,45,.1);animation:tg .7s cubic-bezier(.2,1,.3,1) var(--d) backwards}
@keyframes tg{from{opacity:0;transform:skewX(-14deg) translateX(-50px)}}
.emb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.emb i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#ff7a3a;opacity:0;box-shadow:0 0 8px rgba(255,58,30,.8);animation:rise var(--t) linear var(--w) infinite}
@keyframes rise{10%{opacity:.5}90%{opacity:.2}100%{transform:translate(var(--x),-90vh);opacity:0}}
.halo{position:absolute;left:50%;top:46%;width:min(100%,80vh);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,rgba(255,30,45,.14),transparent 65%);border-radius:50%}
.halo i{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,30,45,.4);animation:spin 26s linear infinite}
.halo i+i{inset:9%;border:3px solid transparent;border-top-color:rgba(255,30,45,.65);border-bottom-color:rgba(255,30,45,.65);animation-duration:9s;animation-direction:reverse}
.lap{font:500 clamp(.55rem,1.5vh,.8rem) Orbitron;color:#fff;opacity:.85;letter-spacing:.1em}
@media(max-height:720px){.tags{display:none}}
@media(max-width:800px){.tags{justify-content:center}.role{font-size:.75rem}.halo{top:40%}}
.bignum{position:absolute;left:50%;top:44%;transform:translate(calc(-50% + var(--px,0)*16px),calc(-50% + var(--py,0)*10px));font:900 min(36vh,21vw) Orbitron;color:transparent;-webkit-text-stroke:2px rgba(255,30,45,.18);animation:bn 8s ease-in-out infinite alternate;pointer-events:none}
@keyframes bn{to{-webkit-text-stroke-color:rgba(255,30,45,.3);filter:blur(.4px)}}
.radar i{position:absolute;left:50%;top:40%;width:30%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,30,45,.35);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:rad 4.5s ease-out infinite;pointer-events:none}
.radar i:nth-child(2){animation-delay:1.5s}.radar i:nth-child(3){animation-delay:3s}
@keyframes rad{20%{opacity:.45}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0}}
@media(max-width:800px){.bignum{display:none}}
.bgt{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.disc{position:absolute;color:rgba(255,30,45,.17);animation:spin 70s linear infinite}
.disc.d1{width:66vh;left:-14vh;top:-12vh}
.disc.d2{width:50vh;right:-12vh;bottom:8%;animation-duration:45s;animation-direction:reverse}
.weave{position:absolute;inset:0;opacity:.2;background:radial-gradient(rgba(255,150,160,.55) 1.2px,transparent 1.7px) 0 0/28px 28px;animation:dr 14s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%)}
@keyframes dr{to{background-position:28px 28px}}
.hc{position:absolute;top:10px;font:500 clamp(.5rem,1.3vh,.68rem) Orbitron;letter-spacing:.14em;color:rgba(255,205,210,.55)}
.hc b{color:#fff;font-weight:500}.hc.tl{left:clamp(10px,3vw,60px)}.hc.tr{right:14px}
.sweep{position:absolute;left:50%;top:46%;width:min(100%,80vh);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none}
.sweep i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,30,45,.22),transparent 26%);-webkit-mask:radial-gradient(circle,transparent 20%,#000 21%);mask:radial-gradient(circle,transparent 20%,#000 21%);animation:spin 6s linear infinite}
@media(max-width:800px){.hc{display:none}.disc.d1{width:42vh}}
/* about */
.ag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.4vh,14px);width:min(100%,1000px)}
.w2{grid-column:span 2}.w4{grid-column:span 4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips em{font:500 .8rem Orbitron;font-style:normal;border:1px solid var(--red);padding:3px 10px;color:var(--red);animation:pulse 3s infinite var(--d)}
@keyframes pulse{50%{background:var(--red);color:#000}}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.bar div{height:7px;background:#2a0007;transform:skewX(-20deg)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--deep),var(--red));box-shadow:0 0 10px var(--red);animation:gr 1.6s cubic-bezier(.2,.8,.2,1) 1.6s backwards}
@keyframes gr{from{width:0!important}}
.bar span{font:500 .75rem Orbitron}.bar u{text-decoration:none;font:500 .7rem Orbitron;color:var(--red)}
/* awards + family */
.pg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(10px,2vw,22px);width:min(100%,1000px)}
.aw{text-align:center;padding-top:clamp(14px,3vh,30px)}
.aw .p{font:900 clamp(2.6rem,9vh,5rem) Orbitron;color:transparent;-webkit-text-stroke:2px var(--red);line-height:1;animation:glow 2.6s infinite alternate}
@keyframes glow{to{text-shadow:0 0 28px var(--red);color:rgba(255,30,45,.25)}}
.aw .t{font:900 clamp(.9rem,1.6vw,1.2rem) Orbitron;color:#fff;margin:8px 0 4px}
.aw p{font-size:clamp(1rem,1.5vw,1.2rem);font-weight:500;line-height:1.3}
.row{width:min(100%,1000px)}
.row h4{font:900 .85rem Orbitron;color:var(--red);letter-spacing:.2em;margin-bottom:6px}
.fc{display:flex;gap:12px;align-items:center}
.ph{position:relative;flex:none;width:clamp(64px,15vh,130px);aspect-ratio:1;border:2px solid var(--deep);background:#200006;display:grid;place-items:center;font:900 1.2rem Orbitron;color:var(--red);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc p{font-size:clamp(.9rem,1.3vw,1.1rem);font-weight:500;line-height:1.25}
/* wipe */
#wipe{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.sheet{position:absolute;inset:0;transform:translateX(-140%);background:linear-gradient(90deg,#000 60%,#3a0008);display:grid;place-items:center}
.sheet::after{content:"";position:absolute;right:0;top:0;bottom:0;width:40px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/20px 20px}
#wt{font:900 clamp(1.4rem,6vw,4rem) Orbitron;color:transparent;-webkit-text-stroke:2px var(--red);letter-spacing:.1em;text-align:center}
.car{position:absolute;right:-22px;top:50%;width:min(44vw,420px);transform:translateY(-50%);filter:drop-shadow(0 0 18px var(--red))}
.car .wh{transform-box:fill-box;transform-origin:center;animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.logo{display:none}header{justify-content:center}.rpm{display:none}.ag{grid-template-columns:repeat(2,minmax(0,1fr))}.w4{grid-column:span 2}.pg{--n:1!important;gap:8px}.aw .p{font-size:2rem}.hm{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto}.ht{padding:0 8px;text-align:center}.nm{font-size:clamp(1.3rem,7vw,2.2rem)}.hi{font-size:clamp(2rem,7vh,3.2rem)}.sl{justify-content:center}.mid{display:none}.g{width:clamp(80px,17vh,130px)}.db{height:clamp(90px,19vh,140px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important}}

/* ===== REVAMPED RACING HERO ===== */
#boot{background:radial-gradient(ellipse at 50% 48%,#31000b 0%,#100006 42%,#020204 78%);overflow:hidden}
.boot-grid{position:absolute;inset:0;opacity:.28;background:linear-gradient(rgba(255,30,45,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,30,45,.18) 1px,transparent 1px);background-size:44px 44px;transform:perspective(500px) rotateX(58deg) scale(1.8);transform-origin:center bottom;animation:bootgrid 2.5s linear infinite}
@keyframes bootgrid{to{background-position:0 44px,44px 0}}
.boot-frame{position:relative;width:min(88vw,680px);padding:clamp(18px,4vw,38px);border:1px solid rgba(255,30,45,.55);background:rgba(7,0,4,.72);box-shadow:0 0 70px rgba(255,0,35,.18),inset 0 0 40px rgba(255,0,35,.08);animation:bootpop .8s cubic-bezier(.16,1,.3,1) both}
@keyframes bootpop{from{opacity:0;transform:scale(.72) translateY(45px);filter:blur(12px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.boot-frame:before,.boot-frame:after{content:"";position:absolute;width:42px;height:42px;border-color:#ff1e2d;border-style:solid}
.boot-frame:before{top:-2px;left:-2px;border-width:3px 0 0 3px}.boot-frame:after{right:-2px;bottom:-2px;border-width:0 3px 3px 0}
.boot-top,.boot-bottom{display:flex;justify-content:space-between;gap:12px;color:#ff6974;font:500 clamp(.48rem,1.4vw,.68rem) Orbitron;letter-spacing:.13em}
.boot-emblem{font:900 clamp(3rem,12vw,7rem) Orbitron;color:#fff;text-align:center;line-height:1.1;margin:18px 0 4px;text-shadow:0 0 22px #ff1e2d;letter-spacing:-.08em}
.boot-emblem span{font-size:.28em;color:#ff1e2d;vertical-align:top;margin-left:8px;letter-spacing:.08em}
#bt{text-align:center;min-height:72px;font-size:clamp(.72rem,2vw,1rem);letter-spacing:.14em}
#bt span{animation:bootline .35s both}
@keyframes bootline{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.boot-progress{height:3px;background:#2a0710;margin:12px 0 18px;overflow:hidden}
.boot-progress i{display:block;width:0;height:100%;background:#ff1e2d;box-shadow:0 0 14px #ff1e2d;animation:progress 2s linear forwards}
@keyframes progress{to{width:100%}}
.hero-center{display:flex!important;align-items:center;justify-content:center;flex-direction:column;isolation:isolate}
.hero-content{position:relative;z-index:4;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(8px,1.5vh,18px) 10px 0;text-align:center}
.hero-kicker{display:flex;align-items:center;gap:12px;font:500 clamp(.5rem,1.2vh,.72rem) Orbitron;letter-spacing:.28em;color:#ff929b;margin-bottom:clamp(4px,1vh,12px)}
.hero-kicker span{width:clamp(20px,5vw,70px);height:1px;background:linear-gradient(90deg,transparent,#ff1e2d)}
.hero-kicker span:last-child{transform:rotate(180deg)}
.hero-name{font-size:clamp(1.8rem,min(6vw,6vh),5.2rem)!important;line-height:.98!important;margin:0!important;text-align:center;letter-spacing:.015em;filter:drop-shadow(0 0 18px rgba(255,30,45,.32))}

/* education */
.edu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);min-height:0}
.lvl{display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);min-width:0;min-height:0;animation:achup .9s cubic-bezier(.2,.8,.2,1) var(--d) backwards}
.lvl-top{display:flex;align-items:center;gap:10px}
.node{flex:none;width:clamp(26px,4vh,34px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:900 clamp(.55rem,1.3vh,.72rem) Orbitron;color:#fff;background:radial-gradient(circle at 35% 30%,var(--red),var(--deep));box-shadow:0 0 0 3px rgba(255,30,45,.18),0 0 18px var(--glow);animation:nodepulse 4s ease-in-out infinite;animation-delay:calc(var(--i)*1s)}
@keyframes nodepulse{50%{box-shadow:0 0 0 6px rgba(255,30,45,.1),0 0 26px rgba(255,30,45,.5)}}
.lvl-lab{font:700 clamp(.58rem,1.35vh,.76rem) Orbitron;letter-spacing:.2em;color:#fff;text-transform:uppercase;white-space:nowrap}

.ln.end{background:linear-gradient(90deg,rgba(255,30,45,.6),transparent);margin-right:0}.ln.end::after{display:none}
.ln b{position:absolute;top:-2px;left:0;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--red),0 0 18px var(--red);opacity:0;animation:runner 9s linear infinite;animation-delay:calc(var(--i)*3s)}

.lvl-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);padding:clamp(8px,1.5vh,15px);border-radius:14px;border:1px solid rgba(255,255,255,.11);border-top:2px solid var(--red);background:linear-gradient(165deg,rgba(44,10,20,.74),rgba(12,3,8,.82));box-shadow:0 14px 36px rgba(0,0,0,.4);backdrop-filter:blur(8px)}

.shots{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,.9vw,12px)}
.shot{min-width:0;animation:float 6s ease-in-out infinite;animation-delay:calc(var(--k)*-1.4s)}

.frame{position:relative;width:100%;aspect-ratio:3/2;max-height:clamp(70px,19vh,160px);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.28);background:#14050a;box-shadow:0 8px 20px rgba(0,0,0,.5)}

addEventListener("pointermove",e=>{const r=photoHeadlight.getBoundingClientRect(),st=photoHeadlight.style,d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));st.setProperty("--sx",(e.clientX-r.left)+"px");st.setProperty("--sy",(e.clientY-r.top)+"px");st.setProperty("--lit",Math.max(.3,Math.min(1,1.25-d/(r.width*.9))))});
/* typing roles + lap timer */
setInterval(()=>{if(page!==0)return;const t=performance.now()-launch;if(t<2000)return;const m=Math.floor(t/60000),x=t%60000;$("lap").textContent="LAP "+String(m).padStart(2,"0")+":"+(x/1000).toFixed(3).padStart(6,"0")},60);
/* start */
/* intro: Ferrari builds PORTFOLIO, then drives up and pushes the loader away */
let seen=false,booted=false;try{seen=!!localStorage.getItem("introSeen")}catch(e){}
function bootDone(){if(booted)return;booted=true;try{localStorage.setItem("introSeen","1")}catch(e){}const b=$("boot");b.classList.add("up");setTimeout(()=>show(0),380);setTimeout(()=>b.classList.add("off"),1400)}
if(seen)$("boot").classList.add("fast");$("skip").onclick=bootDone;setTimeout(bootDone,seen?500:3050);

</script>
